name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag must not publish code that fails its own suite (gate added
      # 14.11.2026, after a broken test shipped unnoticed in three releases).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lupa (real Lua 5.1 runtime)
        run: python -m pip install --upgrade pip lupa

      - name: Compile every lua file in Lua 5.1
        run: python tests/lua51_compile.py

      - name: Run the test suite
        run: |
          failed=0
          for f in tests/test_*.py; do
            python "$f" || failed=1
          done
          exit $failed

      - uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
